<!-- Calculator.Gallery Simple Calculator -->
<!-- Source provided by the site owner. Responsive HTML/CSS and a JavaScript arithmetic parser. -->
<div id="cg-calculator">
  <style>
    #cg-calculator{width:100%;max-width:100%;margin:20px auto;color:inherit;font-family:inherit;box-sizing:border-box}
    #cg-calculator *,#cg-calculator *::before,#cg-calculator *::after{box-sizing:border-box}
    #cg-calculator .cg-panel{width:100%;max-width:400px;margin:0 auto 20px;padding:20px;background:#fff;color:#172033;border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.07)}
    #cg-calculator h2{text-align:center;margin:0 0 18px;font-size:25px;color:#172033}
    #cg-calculator .cg-display{min-height:90px;padding:15px;margin-bottom:15px;background:#f1f5f9;border-radius:12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
    #cg-calculator #cg-expression{min-height:32px;text-align:right;font-size:25px;font-weight:600;overflow-wrap:anywhere;color:#172033}
    #cg-calculator #cg-result{min-height:20px;margin-top:5px;text-align:right;font-size:14px;color:#64748b}
    #cg-calculator .cg-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    #cg-calculator .cg-buttons button{min-width:0;min-height:58px;padding:8px;border:0;border-radius:10px;background:#e8edf4;color:#172033;font-family:inherit;font-size:20px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
    #cg-calculator .cg-buttons button:hover{filter:brightness(.96)}
    #cg-calculator .cg-buttons button:active{transform:scale(.96)}
    #cg-calculator .cg-buttons .cg-operator{background:#dbeafe;color:#1d4ed8}
    #cg-calculator .cg-buttons .cg-clear{background:#fee2e2;color:#dc2626}
    #cg-calculator .cg-buttons .cg-equal{background:#2563eb;color:#fff}
    #cg-calculator .cg-history-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    #cg-calculator .cg-history-header h3{margin:0;font-size:18px;color:#172033}
    #cg-calculator .cg-history button{cursor:pointer;font-family:inherit}
    #cg-calculator .cg-clear-history{min-height:auto;padding:8px 12px;border:0;border-radius:8px;background:#fee2e2;color:#dc2626;font-size:12px}
    #cg-calculator .cg-history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb}
    #cg-calculator .cg-history-details{min-width:0;overflow-wrap:anywhere}
    #cg-calculator .cg-history-expression{font-weight:600;color:#172033}
    #cg-calculator .cg-history-result{margin-top:4px;color:#2563eb;font-weight:bold}
    #cg-calculator .cg-history-date{display:block;margin-top:4px;color:#94a3b8;font-size:11px}
    #cg-calculator .cg-delete-item{flex-shrink:0;min-height:auto;padding:7px 10px;border:0;border-radius:7px;background:#f1f5f9;color:#172033;font-size:12px}
    #cg-calculator .cg-empty{padding:20px 0;text-align:center;color:#94a3b8;font-size:14px}
    @media(max-width:420px){#cg-calculator .cg-panel{padding:15px;border-radius:14px}#cg-calculator .cg-buttons{gap:7px}#cg-calculator .cg-buttons button{min-height:53px;font-size:18px}#cg-calculator #cg-expression{font-size:21px}}
  </style>
  <div class="cg-panel">
    <h2>Simple Calculator</h2>
    <div class="cg-display"><div id="cg-expression" aria-live="polite">0</div><div id="cg-result"></div></div>
    <div class="cg-buttons">
      <button class="cg-clear" data-action="clear">AC</button><button data-action="delete">DEL</button><button class="cg-operator" data-value="%">%</button><button class="cg-operator" data-value="/">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="cg-operator" data-value="*">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="cg-operator" data-value="-">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="cg-operator" data-value="+">+</button>
      <button data-value="00">00</button><button data-value="0">0</button><button data-action="decimal">.</button><button class="cg-equal" data-action="calculate">=</button>
    </div>
  </div>
  <div class="cg-panel cg-history">
    <div class="cg-history-header"><h3>Calculation History</h3><button class="cg-clear-history" data-action="clear-history">Clear All</button></div>
    <div id="cg-history-list"></div>
  </div>
  <script>
  (function(){
    "use strict";
    const root=document.getElementById("cg-calculator");
    if(!root||root.dataset.initialized==="true")return;
    root.dataset.initialized="true";
    const expressionDisplay=root.querySelector("#cg-expression");
    const resultDisplay=root.querySelector("#cg-result");
    const historyList=root.querySelector("#cg-history-list");
    const STORAGE_KEY="calculator_gallery_history";
    let expression="";
    let finished=false;
    const operators=["+","-","*","/","%"];
    function displayExpression(value){expressionDisplay.textContent=value.replace(/\*/g,"×").replace(/\//g,"÷");}
    function addNumber(number){if(finished){expression="";resultDisplay.textContent="";finished=false;}expression+=number;displayExpression(expression);}
    function addDecimal(){if(finished){expression="";resultDisplay.textContent="";finished=false;}const parts=expression.split(/[+\-*/%]/);const lastNumber=parts[parts.length-1];if(!lastNumber.includes(".")){expression+=".";displayExpression(expression);}}
    function addOperator(operator){if(!expression||expression==="-"){if(operator==="-"){expression="-";displayExpression(expression);}return;}if(finished){finished=false;resultDisplay.textContent="";}const lastCharacter=expression.slice(-1);if(operators.includes(lastCharacter))expression=expression.slice(0,-1);expression+=operator;displayExpression(expression);}
    function deleteLast(){if(finished){resultDisplay.textContent="";finished=false;}expression=expression.slice(0,-1);displayExpression(expression||"0");}
    function clearAll(){expression="";finished=false;expressionDisplay.textContent="0";resultDisplay.textContent="";}
    // Safe arithmetic parser: standard precedence, unary signs, and no eval().
    function tokenize(input){const tokens=input.match(/(?:\d+\.?\d*|\.\d+)|[+\-*/%]/g);if(!tokens||tokens.join("")!==input)throw new Error("Invalid expression");return tokens;}
    function evaluateExpression(input){const tokens=tokenize(input);let position=0;
      function parsePrimary(){const token=tokens[position];if(token==="+"||token==="-"){position++;const value=parsePrimary();return token==="-"?-value:value;}if(!token||!/^(?:\d+\.?\d*|\.\d+)$/.test(token))throw new Error("Invalid number");position++;return Number(token);}
      function parseTerm(){let value=parsePrimary();while(["*","/","%"].includes(tokens[position])){const operator=tokens[position++];const right=parsePrimary();if(operator==="*")value*=right;if(operator==="/"){if(right===0)throw new Error("Division by zero");value/=right;}if(operator==="%")value%=right;}return value;}
      function parseExpression(){let value=parseTerm();while(tokens[position]==="+"||tokens[position]==="-"){const operator=tokens[position++];const right=parseTerm();value=operator==="+"?value+right:value-right;}return value;}
      const answer=parseExpression();if(position!==tokens.length||!Number.isFinite(answer))throw new Error("Invalid calculation");return Number(answer.toPrecision(12));
    }
    function calculate(){if(!expression||finished)return;try{if(operators.includes(expression.slice(-1)))throw new Error("Incomplete calculation");const originalExpression=expression;const answer=evaluateExpression(originalExpression);const formattedExpression=originalExpression.replace(/\*/g,"×").replace(/\//g,"÷");expressionDisplay.textContent=`${formattedExpression} = ${answer}`;resultDisplay.textContent="Calculation complete";saveHistory(formattedExpression,answer);expression=String(answer);finished=true;}catch(error){resultDisplay.textContent=error.message;}}
    function getHistory(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(data)?data:[];}catch{return [];}}
    function saveHistory(calculation,answer){const history=getHistory();history.unshift({id:Date.now()+"-"+Math.random(),expression:calculation,answer:answer,date:new Date().toLocaleString()});try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(0,100)));}catch(error){console.error("History storage error:",error);}renderHistory();}
    function deleteHistory(id){const history=getHistory().filter(item=>item.id!==id);localStorage.setItem(STORAGE_KEY,JSON.stringify(history));renderHistory();}
    function clearHistory(){if(!confirm("Delete all calculation history?"))return;localStorage.removeItem(STORAGE_KEY);renderHistory();}
    function renderHistory(){const history=getHistory();historyList.replaceChildren();if(!history.length){const empty=document.createElement("div");empty.className="cg-empty";empty.textContent="No calculations yet.";historyList.appendChild(empty);return;}history.forEach(item=>{const row=document.createElement("div");row.className="cg-history-item";const details=document.createElement("div");details.className="cg-history-details";const exp=document.createElement("div");exp.className="cg-history-expression";exp.textContent=item.expression+" =";const answer=document.createElement("div");answer.className="cg-history-result";answer.textContent=item.answer;const date=document.createElement("small");date.className="cg-history-date";date.textContent=item.date;details.append(exp,answer,date);const remove=document.createElement("button");remove.className="cg-delete-item";remove.textContent="Delete";remove.addEventListener("click",()=>deleteHistory(item.id));row.append(details,remove);historyList.appendChild(row);});}
    root.querySelector(".cg-buttons").addEventListener("click",function(event){const button=event.target.closest("button");if(!button)return;if(button.dataset.value!==undefined){const value=button.dataset.value;if(operators.includes(value))addOperator(value);else addNumber(value);return;}switch(button.dataset.action){case"clear":clearAll();break;case"delete":deleteLast();break;case"decimal":addDecimal();break;case"calculate":calculate();break;}});
    root.querySelector(".cg-history-header").addEventListener("click",function(event){if(event.target.closest('[data-action="clear-history"]'))clearHistory();});
    document.addEventListener("keydown",function(event){if(!root.isConnected)return;if(/^[0-9]$/.test(event.key))addNumber(event.key);else if(event.key===".")addDecimal();else if(operators.includes(event.key))addOperator(event.key);else if(event.key==="Enter"||event.key==="="){event.preventDefault();calculate();}else if(event.key==="Backspace")deleteLast();else if(event.key==="Escape")clearAll();});
    renderHistory();
  })();
  </script>
</div>
